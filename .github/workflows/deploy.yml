name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        run: npm run build -w @darts/client -- --base-href "/${{ github.event.repository.name }}/"

      # Pages has no SPA fallback: serving index.html as 404.html lets deep links like /game/<id> load the app.
      - run: cp apps/client/dist/DartsApp/browser/index.html apps/client/dist/DartsApp/browser/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/client/dist/DartsApp/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
